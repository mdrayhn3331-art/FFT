<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b1a"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>FFT SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-scene"><div class="splash-ring r1"></div><div class="splash-ring r2"></div><div class="splash-cube"><span>FFT</span></div></div>
  <div class="splash-title">FFT <span>SHOP</span></div><div class="splash-sub">PREMIUM MARKETPLACE</div>
  <div class="loader"><i></i></div><div class="splash-status">Loading your experience...</div>
</div>
<div class="fx-bg"><span></span><span></span><span></span><span></span><span></span></div>
<div id="authGate" class="auth-gate">
  <div class="auth-box glass3d">
    <div class="auth-logo">FFT <span>SHOP</span></div>
    <div class="auth-kicker">PREMIUM MARKETPLACE</div>
    <div id="authGateContent"></div>
  </div>
</div>
<div class="app-shell hidden">
<header class="topbar glass"><div><div class="brand">FFT <span>SHOP</span></div><small>Premium marketplace</small></div><div class="top-actions"><a id="adminLink" class="admin-link hidden" href="admin.html">⚡ Admin</a><button id="cartBtn" class="icon-btn">🛒 <b id="cartCount">0</b></button></div></header>
<main>
<section id="hero" class="hero-card glass3d"><div><span class="pill">3D PREMIUM SHOP</span><h1 id="heroTitle">Everything you need,<br><span>in one place.</span></h1><p id="heroSubtitle">Clothing, premium products and digital services.</p></div><div class="hero-orb">FFT</div></section>
<div id="announcement" class="announcement hidden"></div>
<section class="wallet-card glass"><div><div class="muted">Account Balance</div><strong id="balance">৳0.00</strong></div><button id="depositBtn" class="primary btn3d">+ Add Balance</button></section>
<section id="quickMenu" class="quick-menu">
  <button class="quick-card btn3d" id="socialShopBtn">📱<b>Social Shop</b><small>Like · Comment · Follow · Subscribe</small></button>
  <button class="quick-card btn3d" id="fashionBtn">👕<b>VIP Fashion</b><small>Products + delivery</small></button>
  <button class="quick-card btn3d" id="vipViewBtn">🎬<b>VIP View</b><small>Digital services</small></button>
</section>
<section id="dynamicButtons" class="dynamic-buttons hidden"></section>
<nav class="chips" id="categories"><button class="chip active btn3d" data-cat="all">All</button><button class="chip btn3d" data-cat="Clothing">👕 Clothing</button><button class="chip btn3d" data-cat="Premium Apps">💎 Premium</button><button class="chip btn3d" data-cat="Services">🚀 Services</button><button class="chip btn3d" data-cat="Footwear">👟 Footwear</button><button class="chip btn3d" data-cat="Electronics">🎧 Electronics</button></nav>
<section class="section-head"><h2>Shop</h2><span id="userLabel" class="muted">Not signed in</span></section>
<div id="products" class="product-grid"></div>
</main>
<nav class="bottom-nav glass">
<button class="nav active" id="homeBtn">⌂<span>Home</span></button>
<button class="nav" id="socialNavBtn">📱<span>Social Shop</span></button>
<button class="nav" id="vipNavBtn">🎬<span>VIP View</span></button>
<button class="nav" id="fashionNavBtn">👕<span>Fashion</span></button>
<button class="nav" id="profileBtn">●<span>Profile</span></button>
</nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card glass"><button class="close btn3d" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script>
/* NON-BLOCKING splash failsafe: registered before any external/local app code. */
(function(){
  var done=false;
  window.FFT_HIDE_SPLASH=function(){
    if(done)return; done=true;
    var s=document.getElementById('splash');
    if(s)s.classList.add('hide');
  };
  setTimeout(window.FFT_HIDE_SPLASH, 4600);
})();
</script>
<script src="supabase.js"></script>
<script src="app.js?v=20260824-startup-fix-2"></script>
<script>
/* Last-resort UI recovery if app.js crashes. */
setTimeout(function(){
  window.FFT_HIDE_SPLASH&&window.FFT_HIDE_SPLASH();
  var gate=document.getElementById('authGate');
  var box=document.getElementById('authGateContent');
  if(gate && box && !document.querySelector('.app-shell:not(.hidden)')){
    gate.classList.remove('hidden');
    if(!box.children.length){
      box.innerHTML='<div class="auth-error">App startup failed. Please reload this page.</div><button class="primary btn3d" style="width:100%" onclick="location.reload()">Reload FFT SHOP</button>';
    }
  }
},5200);
</script>
</body></html>
